<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏮 山車GPS送信機</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    select, button { -webkit-user-select: auto; user-select: auto; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #121212; color: #fff; margin: 0; min-height: 100vh; }
    h2 { margin-top: 0; font-size: 1.3rem; color: #ffcc00; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.95rem; }
    select { font-size: 1.1rem; padding: 14px; width: 100%; margin-bottom: 15px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; }
    select:disabled { opacity: 0.5; background: #444; }
    button { font-size: 1.2rem; padding: 18px; width: 100%; border-radius: 12px; border: none; background: #007aff; color: #fff; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
    button.stop { background: #ff3b30; }
    .status { padding: 12px; background: #222; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #007aff; font-size: 0.9rem; }
    #log { font-family: monospace; font-size: 0.75rem; height: calc(100vh - 320px); min-height: 200px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; color: #00ff66; border: 1px solid #333; word-break: break-all; }
  </style>
</head>
<body ondragstart="return false;">

  <h2>🏮 山車GPS送信機</h2>
  
  <label for="dashiSelect">送信する山車を選択:</label>
  <select id="dashiSelect">
    <option value="dashi_01">🏮 先頭) 古新町</option>
    <option value="dashi_02">🏮 中間) 奈呉町</option>
    <option value="dashi_03">🏮 最後尾) 南立町</option>
  </select>
  
  <button id="toggleBtn" onclick="toggleTracking()">送信スタート</button>
  
  <div class="status" id="status">ステータス: 停止中</div>
  
  <h3 style="font-size: 0.95rem; margin: 10px 0 5px 0;">送信ログ</h3>
  <div id="log">アプリを起動中...<br></div>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toUpperCase() === 'U')) {
        e.preventDefault();
      }
    });

    const _0x1a = s => atob(s);
    const SUPABASE_URL = _0x1a('aHR0cHM6Ly92cGpjcWJiaG5id3JiYnZkdmZzYi5zdXBhYmFzZS5jbw==');
    const SUPABASE_KEY = _0x1a('c2JfcHVibGlzaGFibGVfS2NVMDc4d1c2WGRUT2g0elhCaHVId19rdEdxbFN0ZA==');

    function addLog(msg) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML = `[${time}] ${msg}<br>` + logDiv.innerHTML;
    }

    window.onerror = function(msg, url, line) {
      addLog(`エラー: ${msg} (L:${line})`);
      return false;
    };

    let dbClient = null;

    try {
      if (window.supabase && window.supabase.createClient) {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        addLog("✅ 初期化完了");
      } else {
        addLog("❌ 初期化失敗");
      }
    } catch (e) {
      addLog(`❌ エラー: ${e.message}`);
    }

    const INTERVAL_MS = 60000;
    let isTracking = false;
    let timerId = null;
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          addLog("💡 スリープ防止設定有効化");
        }
      } catch (err) {
        addLog(`⚠️ スリープ防止機能非対応: ${err.message}`);
      }
    }

    function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      const dashiSelect = document.getElementById('dashiSelect');
      
      if (!isTracking) {
        isTracking = true;
        btn.innerText = "送信ストップ";
        btn.classList.add("stop");
        dashiSelect.disabled = true;
        
        const selectedText = dashiSelect.options[dashiSelect.selectedIndex].text;
        document.getElementById('status').innerText = `ステータス: 送信中 (${selectedText})`;
        
        requestWakeLock();
        sendLocation();
        timerId = setInterval(sendLocation, INTERVAL_MS);
      } else {
        isTracking = false;
        btn.innerText = "送信スタート";
        btn.classList.remove("stop");
        dashiSelect.disabled = false;
        document.getElementById('status').innerText = "ステータス: 停止中";
        
        if (timerId) clearInterval(timerId);
        if (wakeLock) {
          wakeLock.release();
          wakeLock = null;
        }
      }
    }

    function sendLocation() {
      addLog("📡 位置情報を取得中...");

      if (!navigator.geolocation) {
        addLog("❌ 位置情報取得非対応");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          addLog(`📍 位置取得成功: ${lat.toFixed(5)}, ${lng.toFixed(5)}`);

          if (!dbClient) {
            addLog("❌ データベース未接続");
            return;
          }

          const selectedDashiId = document.getElementById('dashiSelect').value;
          addLog(`🚀 送信中... (${selectedDashiId})`);

          const { data, error } = await dbClient
            .from('locations')
            .insert([{ dashi_id: selectedDashiId, lat: lat, lng: lng }]);
  
          if (error) {
            addLog(`❌ 送信エラー: ${error.message}`);
          } else {
            addLog(`✅ 送信完了 (${selectedDashiId})`);
          }
        },
        (error) => {
          addLog(`❌ 取得失敗: (${error.code}) ${error.message}`);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
