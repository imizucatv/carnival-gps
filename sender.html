<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏮 山車GPS送信機</title>
  <!-- Supabaseのライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; margin: 0; }
    button { font-size: 1.2rem; padding: 18px; width: 100%; border-radius: 12px; border: none; background: #007aff; color: #fff; font-weight: bold; margin-bottom: 15px; }
    button.stop { background: #ff3b30; }
    .status { padding: 12px; background: #222; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #007aff; }
    #log { font-family: monospace; font-size: 0.8rem; height: 280px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; color: #00ff66; border: 1px solid #333; }
  </style>
</head>
<body>
  <h2>🏮 山車GPS送信機</h2>
  <button id="toggleBtn" onclick="toggleTracking()">送信スタート</button>
  <div class="status" id="status">ステータス: 停止中</div>
  <div id="log">アプリを起動しました</div>

  <script>
    // ★ ここをステップ1でメモしたものに書き換えてください ★
    const SUPABASE_URL = 'https://vpjcqbbhnbwrbbvdvfsb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KcU078wW6XdTOh4zXBhuHw_ktGqlStd';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const INTERVAL_MS = 60000; // 1分間隔
    let isTracking = false, timerId = null, wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      if (!isTracking) {
        isTracking = true;
        btn.innerText = "送信ストップ"; btn.classList.add("stop");
        document.getElementById('status').innerText = "ステータス: 送信中 (1分間隔)";
        requestWakeLock();
        sendLocation();
        timerId = setInterval(sendLocation, INTERVAL_MS);
      } else {
        isTracking = false;
        btn.innerText = "送信スタート"; btn.classList.remove("stop");
        document.getElementById('status').innerText = "ステータス: 停止中";
        clearInterval(timerId);
        if (wakeLock) wakeLock.release();
      }
    }

    function sendLocation() {
      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        addLog(`📍 取得: ${lat.toFixed(5)}, ${lng.toFixed(5)}`);

        // Supabaseの locations テーブルにデータを挿入 (INSERT)
        const { error } = await supabase
          .from('locations')
          .insert([{ dashi_id: 'dashi_01', lat: lat, lng: lng }]);

        if (error) {
          addLog(`❌ 送信エラー: ${error.message}`);
        } else {
          addLog(`✅ Supabase保存完了！`);
        }
      }, (error) => {
        addLog(`❌ GPSエラー: ${error.message}`);
      }, { enableHighAccuracy: true });
    }

    function addLog(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + logDiv.innerHTML;
    }
  </script>
</body>
</html>
