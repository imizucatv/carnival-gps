<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏮 山車GPS送信機</title>
  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; margin: 0; }
    h2 { margin-top: 0; font-size: 1.4rem; }
    button { font-size: 1.2rem; padding: 18px; width: 100%; border-radius: 12px; border: none; background: #007aff; color: #fff; font-weight: bold; margin-bottom: 15px; }
    button.stop { background: #ff3b30; }
    .status { padding: 12px; background: #222; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #007aff; }
    #log { font-family: monospace; font-size: 0.8rem; height: 320px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; color: #00ff66; border: 1px solid #333; word-break: break-all; }
  </style>
</head>
<body>

  <h2>🏮 山車GPS送信機</h2>
<h2>🏮 山車GPS送信機</h2>
  
  <!-- 追加: 山車を選ぶリスト -->
  <select id="dashiSelect" style="font-size: 1.2rem; padding: 12px; width: 100%; margin-bottom: 15px; border-radius: 8px;">
    <option value="dashi_01">🏮 一番山車</option>
    <option value="dashi_02">🏮 二番山車</option>
    <option value="dashi_03">🏮 三番山車</option>
  </select>
  
  <button id="toggleBtn" onclick="toggleTracking()">送信スタート</button>
  
  <div class="status" id="status">ステータス: 停止中</div>
  
  <h3>送信ログ</h3>
  <div id="log">アプリを起動中...<br></div>

  <script>
    function addLog(msg) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML = `[${time}] ${msg}<br>` + logDiv.innerHTML;
    }

    // JavaScriptエラーをログ画面に表示させる設定
    window.onerror = function(msg, url, line) {
      addLog(`💥 JavaScriptエラー: ${msg} (L:${line})`);
      return false;
    };

    // ★ ここをご自身のURLとPublishable Keyに書き換えてください ★
    const SUPABASE_URL = 'https://vpjcqbbhnbwrbbvdvfsb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KcU078wW6XdTOh4zXBhuHw_ktGqlStd';

    let dbClient = null;

    // 初期化処理
    try {
      if (window.supabase && window.supabase.createClient) {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        addLog("✅ Supabaseの初期化に成功しました");
      } else {
        addLog("❌ Supabaseライブラリの読み込みに失敗しました");
      }
    } catch (e) {
      addLog(`❌ 初期化エラー: ${e.message}`);
    }

    const INTERVAL_MS = 60000; // 1分間隔
    let isTracking = false;
    let timerId = null;
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          addLog("💡 スリープ防止を有効化しました");
        }
      } catch (err) {
        addLog(`⚠️ スリープ防止スキップ: ${err.message}`);
      }
    }

    function toggleTracking() {
      addLog("👆 ボタンが押されました");
      const btn = document.getElementById('toggleBtn');
      
      if (!isTracking) {
        isTracking = true;
        btn.innerText = "送信ストップ";
        btn.classList.add("stop");
        document.getElementById('status').innerText = "ステータス: 送信中 (1分間隔)";
        
        requestWakeLock();
        sendLocation();
        timerId = setInterval(sendLocation, INTERVAL_MS);
      } else {
        isTracking = false;
        btn.innerText = "送信スタート";
        btn.classList.remove("stop");
        document.getElementById('status').innerText = "ステータス: 停止中";
        
        if (timerId) clearInterval(timerId);
        if (wakeLock) {
          wakeLock.release();
          wakeLock = null;
        }
      }
    }

    function sendLocation() {
      addLog("📡 位置情報を取得中...");

      if (!navigator.geolocation) {
        addLog("❌ このブラウザはGPSに対応していません");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          addLog(`📍 取得成功: ${lat.toFixed(5)}, ${lng.toFixed(5)}`);

          if (!dbClient) {
            addLog("❌ Supabaseが準備できていないため送信できません");
            return;
          }

          addLog("🚀 Supabaseへ送信中...");
          const { data, error } = await dbClient
            .from('locations')

          // 修正前:
          // .insert([{ dashi_id: 'dashi_01', lat: lat, lng: lng }]);

          // 修正後:
          const selectedDashiId = document.getElementById('dashiSelect').value;

          const { data, error } = await dbClient
            .from('locations')
            .insert([{ dashi_id: selectedDashiId, lat: lat, lng: lng }]);
  
          if (error) {
            addLog(`❌ Supabase送信エラー: ${error.message}`);
          } else {
            addLog(`✅ Supabase保存完了！`);
          }
        },
        (error) => {
          addLog(`❌ GPS取得失敗: code(${error.code}) ${error.message}`);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
