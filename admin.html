<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ マップ管理画面</title>
  
  <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; height: 100vh; background: #121212; color: #fff; }
    
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #121212; z-index: 9999; display: flex;
      justify-content: center; align-items: center;
    }
    .login-card {
      background: #1e1e1e; padding: 30px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 320px; text-align: center; border: 1px solid #333;
    }
    .login-card h2 { margin-top: 0; font-size: 1.3rem; color: #ffcc00; }
    .login-card input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
      border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; box-sizing: border-box; text-align: center;
    }
    .login-card button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #007aff; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    #login-error { color: #ff3b30; font-size: 0.85rem; margin-top: 10px; display: none; }

    #sidebar {
      width: 340px; background: #1e1e1e; color: #fff; padding: 15px;
      box-sizing: border-box; overflow-y: auto; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    #map { flex: 1; height: 100vh; }
    h2 { font-size: 1.2rem; margin-top: 0; border-bottom: 2px solid #007aff; padding-bottom: 5px; }
    h3 { font-size: 1rem; margin: 5px 0; color: #ffcc00; }
    .section { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    label { display: block; margin-top: 6px; font-size: 0.8rem; color: #ccc; }
    input, select, button { width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid #444; font-size: 0.85rem; box-sizing: border-box; }
    select, input[type="text"] { background: #222; color: #fff; }
    button { background: #007aff; color: #fff; font-weight: bold; cursor: pointer; margin-top: 8px; border: none; }
    button.secondary { background: #444; color: #fff; }
    button.danger { background: #ff3b30; }
    button.success { background: #34c759; font-size: 1rem; padding: 12px; }
    button.logout { background: #333; font-size: 0.8rem; padding: 8px; margin-top: 10px; }
    
    .mode-selector { display: flex; gap: 5px; margin-bottom: 8px; }
    .mode-btn { flex: 1; padding: 8px; font-size: 0.8rem; background: #333; border: 1px solid #555; color: #aaa; }
    .mode-btn.active { background: #007aff; color: #fff; border-color: #007aff; }

    .btn-group { display: flex; gap: 5px; }
    .poi-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 6px; margin-top: 5px; border-radius: 4px; font-size: 0.8rem; }
    .poi-item button { width: auto; padding: 3px 6px; margin: 0; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>⚙️ 管理者ログイン</h2>
      <input type="password" id="passInput" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter') checkPassword()">
      <button onclick="checkPassword()">ログイン</button>
      <div id="login-error">パスワードが間違っています</div>
    </div>
  </div>

  <!-- 管理パネル -->
  <div id="sidebar">
    <div>
      <h2>⚙️ マップ管理パネル</h2>
      
      <!-- 施設追加セクション -->
      <div class="section">
        <h3>1. 施設（POI）設置</h3>
        <label>種別:</label>
        <select id="poiCategory">
          <option value="toilet">🚻 トイレ</option>
          <option value="parking">🅿️ 駐車場</option>
          <option value="bus">🚌 バス停</option>
        </select>
        <label>施設名:</label>
        <input type="text" id="poiName" placeholder="例: シャトルバス乗り場">
        <label>コメント（補足メモ）:</label>
        <input type="text" id="poiComment" placeholder="例: 15分間隔で運行中">
        <p style="font-size:0.7rem; color:#aaa; margin:4px 0;">※地図上をクリックした場所に設置されます</p>
        
        <!-- CSV一括登録 ＆ テンプレートダウンロード -->
        <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">
        <label style="font-weight:bold; color:#ffcc00;">📁 CSVファイル一括登録:</label>
        <button class="secondary" onclick="downloadTemplate()" style="font-size:0.75rem; padding: 6px; margin-bottom: 6px;">📥 テンプレートCSVをダウンロード</button>
        <input type="file" id="csvFile" accept=".csv" onchange="importCSV(event)" style="background:#222; font-size:0.75rem;">
        
        <div id="poiList" style="max-height: 120px; overflow-y: auto; margin-top: 8px;"></div>
      </div>

      <!-- ルート作図セクション -->
      <div class="section">
        <h3>2. 巡行ルート作成</h3>
        <label>編集コース選択:</label>
        <div class="mode-selector">
          <button class="mode-btn active" id="btnDay" onclick="switchRouteMode('day')">☀️ 昼コース</button>
          <button class="mode-btn" id="btnNight" onclick="switchRouteMode('night')">🌙 夜コース</button>
        </div>
        <p style="font-size:0.7rem; color:#aaa; margin:4px 0;">※地図上を順番にクリックして線を引きます</p>
        
        <div class="btn-group">
          <button class="secondary" onclick="undoRoute()">↩️ 1つ戻る</button>
          <button class="danger" onclick="clearRoute()">🗑️ クリア</button>
        </div>
        <p id="routeCount" style="font-size:0.8rem; margin-top:6px; font-weight:bold;">通過点: 0 箇所</p>
      </div>

      <!-- 保存ボタン -->
      <button class="success" onclick="saveAllConfig()">💾 設定をデータベースに保存</button>
      <div id="msg" style="margin-top:8px; font-size:0.85rem; color:#00ff66; text-align:center;"></div>
    </div>

    <button class="logout" onclick="logout()">🔒 ログアウト</button>
  </div>

  <div id="map"></div>

  <script>
    const ADMIN_PASS = 'imizu2027ad';

    function checkPassword() {
      if (document.getElementById('passInput').value === ADMIN_PASS) {
        sessionStorage.setItem('admin_auth', 'true');
        document.getElementById('login-overlay').style.display = 'none';
        initMap();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_auth');
      location.reload();
    }

    window.onload = function() {
      if (sessionStorage.getItem('admin_auth') === 'true') {
        document.getElementById('login-overlay').style.display = 'none';
        initMap();
      }
    };

    const SUPABASE_URL = 'https://vpjcqbbhnbwrbbvdvfsb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KcU078wW6XdTOh4zXBhuHw_ktGqlStd';
    let dbClient = null;
    let map = null;

    let pois = [];
    let dayRouteCoords = [];
    let nightRouteCoords = [];
    let currentRouteMode = 'day';
    let poiMarkers = [];

    function initMap() {
      if (map) return;
      dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      map = new maplibregl.Map({
        container: 'map',
        style: {
          'version': 8,
          'sources': { 'osm': { 'type': 'raster', 'tiles': ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'], 'tileSize': 256 } },
          'layers': [{ 'id': 'osm', 'type': 'raster', 'source': 'osm' }]
        },
        center: [137.045, 36.700],
        zoom: 14
      });

      map.on('click', (e) => {
        const lng = e.lngLat.lng;
        const lat = e.lngLat.lat;

        const nameInput = document.getElementById('poiName');
        const commentInput = document.getElementById('poiComment');

        if (nameInput.value.trim() !== '') {
          const category = document.getElementById('poiCategory').value;
          const icons = { toilet: '🚻', parking: '🅿️', bus: '🚌' };
          
          pois.push({
            id: Date.now(),
            name: nameInput.value.trim(),
            category,
            comment: commentInput.value.trim(),
            lat, lng,
            icon: icons[category]
          });
          nameInput.value = '';
          commentInput.value = '';
          updatePoiMarkers();
        } else {
          if (currentRouteMode === 'day') dayRouteCoords.push([lng, lat]);
          else nightRouteCoords.push([lng, lat]);
          updateRouteLines();
        }
      });

      map.on('load', loadConfig);
    }

    // テンプレートCSVのダウンロード処理 (文字化け防止BOM付)
    function downloadTemplate() {
      const csvContent = "\uFEFF" + 
        "種別,施設名,緯度,経度,コメント\n" +
        "bus,駅前シャトルバス乗り場,36.6960,137.0420,15分間隔で運行中（最終21:00）\n" +
        "toilet,中央公園 仮設トイレ,36.7020,137.0480,バリアフリートイレあり\n" +
        "parking,臨時第1グラウンド駐車場,36.7050,137.0520,収容200台・無料\n";

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', 'spot_template.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function switchRouteMode(mode) {
      currentRouteMode = mode;
      document.getElementById('btnDay').classList.toggle('active', mode === 'day');
      document.getElementById('btnNight').classList.toggle('active', mode === 'night');
      updateRouteLines();
    }

    function undoRoute() {
      if (currentRouteMode === 'day' && dayRouteCoords.length > 0) dayRouteCoords.pop();
      else if (currentRouteMode === 'night' && nightRouteCoords.length > 0) nightRouteCoords.pop();
      updateRouteLines();
    }

    function clearRoute() {
      if (currentRouteMode === 'day') dayRouteCoords = [];
      else nightRouteCoords = [];
      updateRouteLines();
    }

    function updatePoiMarkers() {
      poiMarkers.forEach(m => m.remove());
      poiMarkers = [];
      const listDiv = document.getElementById('poiList');
      listDiv.innerHTML = '';

      pois.forEach((spot, idx) => {
        const el = document.createElement('div');
        el.style.fontSize = '18px';
        el.innerText = spot.icon;

        const popupText = `<b>${spot.name}</b><br>${spot.comment || ''}`;
        const m = new maplibregl.Marker({ element: el })
          .setLngLat([spot.lng, spot.lat])
          .setPopup(new maplibregl.Popup().setHTML(popupText))
          .addTo(map);
          
        poiMarkers.push(m);

        listDiv.innerHTML += `
          <div class="poi-item">
            <span>${spot.icon} ${spot.name}</span>
            <button class="danger" onclick="deletePoi(${idx})">削除</button>
          </div>
        `;
      });
    }

    function deletePoi(idx) {
      pois.splice(idx, 1);
      updatePoiMarkers();
    }

    function updateRouteLines() {
      const activeCoords = currentRouteMode === 'day' ? dayRouteCoords : nightRouteCoords;
      document.getElementById('routeCount').innerText = `通過点 (${currentRouteMode==='day'?'昼':'夜'}): ${activeCoords.length} 箇所`;

      const dayGeojson = { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': dayRouteCoords } };
      if (map.getSource('admin-day-route')) {
        map.getSource('admin-day-route').setData(dayGeojson);
      } else {
        map.addSource('admin-day-route', { 'type': 'geojson', 'data': dayGeojson });
        map.addLayer({ 'id': 'admin-day-layer', 'type': 'line', 'source': 'admin-day-route', 'paint': { 'line-color': '#ff2d55', 'line-width': 6 } });
      }

      const nightGeojson = { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': nightRouteCoords } };
      if (map.getSource('admin-night-route')) {
        map.getSource('admin-night-route').setData(nightGeojson);
      } else {
        map.addSource('admin-night-route', { 'type': 'geojson', 'data': nightGeojson });
        map.addLayer({ 'id': 'admin-night-layer', 'type': 'line', 'source': 'admin-night-route', 'paint': { 'line-color': '#ffcc00', 'line-width': 6, 'line-dasharray': [2, 1] } });
      }
    }

    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split('\n');
        let count = 0;

        lines.forEach((line, index) => {
          if (index === 0 || !line.trim()) return;
          const cols = line.split(',');
          if (cols.length >= 4) {
            const category = cols[0].trim();
            const name = cols[1].trim();
            const lat = parseFloat(cols[2].trim());
            const lng = parseFloat(cols[3].trim());
            const comment = cols[4] ? cols[4].trim() : '';

            const icons = { toilet: '🚻', parking: '🅿️', bus: '🚌' };

            if (!isNaN(lat) && !isNaN(lng)) {
              pois.push({ id: Date.now() + count, name, category, lat, lng, comment, icon: icons[category] || '📍' });
              count++;
            }
          }
        });

        updatePoiMarkers();
        alert(`✅ CSVから ${count} 件の施設を登録しました！`);
      };
      reader.readAsText(file);
    }

    async function loadConfig() {
      const { data } = await dbClient.from('map_config').select('*');
      if (data) {
        data.forEach(row => {
          if (row.id === 'pois') pois = row.data || [];
          if (row.id === 'route_day') dayRouteCoords = row.data || [];
          if (row.id === 'route_night') nightRouteCoords = row.data || [];
        });
        updatePoiMarkers();
        updateRouteLines();
      }
    }

    async function saveAllConfig() {
      document.getElementById('msg').innerText = "保存中...";
      await dbClient.from('map_config').upsert([
        { id: 'pois', data: pois },
        { id: 'route_day', data: dayRouteCoords },
        { id: 'route_night', data: nightRouteCoords }
      ]);
      document.getElementById('msg').innerText = "✅ データベースへ保存完了！";
    }
  </script>
</body>
</html>
